<!doctype html>
<html lang="ms">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simpulan Kasih | COM3083</title>
<body>
<p id="status">Sedang membuka portfolio kumpulan…</p>
<script>
async function bukaPortfolio() {
  const url = "https://raw.githubusercontent.com/muhdafiqdanialb-cloud/SIMPULAN-KASIH-/ec6600e359f8ed1e93a9b5aafee1ad22997a4262/index.html";
  const respons = await fetch(url);
  if (!respons.ok) throw new Error();

  let halaman = await respons.text();
  halaman = halaman.replace("\ninit();", "\nrender();");
  halaman = halaman.replace("</head>", `<style>
    #edit, #export, #notice, .onlyedit, [data-doc] { display: none !important; }
    [data-photo] { pointer-events: none; }
  </style></head>`);
  halaman = halaman.replace("\nrender();", `
    render();
    document.querySelectorAll('[data-photo]').forEach(b => b.disabled = true);
  `);

  document.open();
  document.write(halaman);
  document.close();
}
bukaPortfolio().catch(() => {
  document.getElementById("status").textContent =
    "Portfolio belum dapat dimuatkan. Sila muat semula halaman.";
});
</script>
</body>
</html>
